# The plugin runs inside whatever interpreter Hermes was installed with, on
# whatever OS the user has. The suite is stdlib unittest with no dependencies,
# so it can be run everywhere cheaply — and the code has enough platform-
# conditional behavior (HERMES_HOME resolution, the fastembed cache directory,
# symlink-vs-junction linking) that Linux-only coverage would miss the bugs
# that actually reach users.
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # No install step: mem0ai and qdrant-client are absent here, so the
        # integration tests skip themselves and the pure-logic tests run
        # against the stubs in tests/_bootstrap.py. MEM0_HERMES_NO_INSTALL
        # refuses runtime pip installs, so selecting an embedder in a test can
        # never mutate the interpreter running the suite.
        env:
          MEM0_HERMES_NO_INSTALL: "1"
        run: python -m unittest discover -s tests -t tests -v
